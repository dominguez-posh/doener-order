<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dönerbestellung</title>
<meta name="theme-color" content="#2a1a10">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/order.js"></script>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <h1 data-shop>Dönerbestellung</h1>
        <p>Bestellen, bezahlen, abholen lassen – die Azubis kümmern sich um den Rest.</p>
      </div>
      <div class="round-box" data-round-box aria-live="polite">
        <span class="muted">Lade Bestellrunde …</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <main>
      <div data-closed class="hidden"></div>
      <div class="toolbar-sticky">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" data-search placeholder="Suchen: Nummer oder Name, z. B. „Dürüm“ oder „04“" aria-label="Speisekarte durchsuchen">
        </div>
        <nav class="cat-nav" data-cat-nav aria-label="Kategorien"></nav>
      </div>
      <div data-menu></div>
      <p class="empty-search hidden" data-empty>Nichts gefunden.</p>
      <section class="my-orders hidden" data-my-orders>
        <h2>Deine Bestellungen auf diesem Gerät</h2>
        <ul></ul>
      </section>
    </main>

    <aside class="cart card" data-cart-side aria-label="Warenkorb"></aside>
  </div>

  <div class="cart-bar hidden" data-cart-bar>
    <button type="button" class="btn-primary" data-open-cart>
      <span data-bar-count>Warenkorb</span>
      <span data-bar-total class="money"></span>
    </button>
  </div>
</body>
</html>
